name: Backend CI

on:
    push:
        paths: ["backend/**", ".github/workflows/backend.yml"]
    pull_request:
        paths: ["backend/**", ".github/workflows/backend.yml"]
jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
            - run: uv sync
            - name: Lint
              run: uv run ruff check .
            - name: Format Check
              run: uv run ruff format --check .
            - name: Type Check
              run: uv run mypy app
            - name: Tests
              run: uv run pytest



