name: Backend CI

on:
    push:
        branches: [main]
    pull_request:
jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v9.0.0
            - run: uv sync --locked
            - name: Lint
              run: uv run ruff check .
            - name: Format Check
              run: uv run ruff format --check .
            - name: Type Check
              run: uv run mypy app tests
            - name: Tests
              run: uv run pytest



