name: Frontend CI

on:
    push:
        branches: [main]
    pull_request:
jobs:
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7.0.0
              with:
                node-version: "26"
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
